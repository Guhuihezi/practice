<title>HarmonyOS 中级2.0 · 刷题练习</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif; background:#F4F3EE; color:#1A1B1C; padding:16px 12px 60px; }
  .wrap { max-width:780px; margin:0 auto; }

  .header { background:linear-gradient(135deg,#0E8F8B,#0B6E7E); color:#fff; border-radius:16px; padding:18px 20px; box-shadow:0 2px 10px rgba(11,110,126,.18); }
  .header h1 { font-size:20px; font-weight:700; }
  .header .sub { font-size:12.5px; opacity:.85; margin-top:4px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .stat { background:rgba(255,255,255,.16); border-radius:10px; padding:8px 14px; min-width:86px; flex:1 1 30%; }
  .stat .n { font-size:19px; font-weight:700; }
  .stat .l { font-size:11px; opacity:.85; }

  .bar { background:#fff; border-radius:12px; padding:12px 14px; margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .bar .g { font-size:13px; font-weight:600; margin-right:2px; }
  select, .btn { border:1px solid #D8D6CE; background:#fff; border-radius:9px; padding:7px 11px; font-size:13px; color:#1A1B1C; cursor:pointer; }
  select { flex:1 1 auto; min-width:0; max-width:100%; }
  .btn { flex:0 0 auto; min-height:32px; }
  select:focus { outline:2px solid #0E8F8B33; }
  .btn:hover { border-color:#0E8F8B; }
  .btn.on { background:#0E8F8B; border-color:#0E8F8B; color:#fff; font-weight:600; }
  .btn.danger { color:#B33235; }
  .btn.ghost { background:transparent; }
  .spacer { flex:1; }

  .qcard { background:#fff; border-radius:14px; padding:20px; margin-top:14px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
  .qhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .qno { font-size:13px; color:#6B7280; font-weight:600; }
  .tag { font-size:11.5px; padding:3px 9px; border-radius:999px; font-weight:600; }
  .tag.t1 { background:#E8F3FB; color:#1769AA; }
  .tag.t2 { background:#FFF3E0; color:#B26A00; }
  .tag.t3 { background:#E8F5E9; color:#2E7D32; }
  .tag.t7 { background:#EDE7F6; color:#5E35B1; }
  .qstem { margin-top:14px; font-size:15.5px; line-height:1.8; overflow-wrap:break-word; word-break:break-word; }
  .qstem img { max-width:100%; border-radius:8px; margin-top:6px; display:block; }
  .qstem p { margin:4px 0; }
  .opt .val img { max-width:100%; border-radius:6px; margin-top:4px; }
  .opt .val { overflow-wrap:break-word; word-break:break-word; }
  .result { overflow-wrap:break-word; word-break:break-word; }

  .opts { margin-top:16px; display:flex; flex-direction:column; gap:10px; }
  .opt { display:flex; align-items:flex-start; gap:10px; border:1.5px solid #E4E3DD; border-radius:11px; padding:11px 14px; cursor:pointer; transition:all .12s; }
  .opt:hover { border-color:#0E8F8B99; }
  .opt .key { flex:0 0 26px; height:26px; border-radius:50%; background:#F0EFEA; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#4B5563; }
  .opt .val { font-size:14.5px; line-height:1.7; flex:1; }
  .opt .val img { max-width:100%; border-radius:6px; margin-top:4px; }
  .opt.sel { border-color:#0E8F8B; background:#F0FAF9; }
  .opt.sel .key { background:#0E8F8B; color:#fff; }
  .opt.right { border-color:#52C41A; background:#F4FBF1; }
  .opt.right .key { background:#52C41A; color:#fff; }
  .opt.wrong { border-color:#EA6668; background:#FEF4F4; }
  .opt.wrong .key { background:#EA6668; color:#fff; }
  .opt.disabled { cursor:default; }

  .fillbox { margin-top:16px; }
  .fillbox label { font-size:13px; color:#6B7280; display:block; margin-bottom:6px; }
  .fillbox input { width:100%; border:1.5px solid #E4E3DD; border-radius:10px; padding:11px 13px; font-size:14.5px; font-family:inherit; }
  .fillbox input:focus { outline:none; border-color:#0E8F8B; }

  .actrow { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .actrow .btn { flex:1; min-width:110px; padding:10px 12px; font-size:14px; border-radius:10px; }
  .btn.submit { background:#0E8F8B; border-color:#0E8F8B; color:#fff; font-weight:600; }
  .btn.submit:hover { background:#0C7F7C; }

  .result { margin-top:16px; border-radius:11px; padding:14px 16px; font-size:14px; line-height:1.8; display:none; }
  .result.show { display:block; }
  .result.ok { background:#F4FBF1; border:1px solid #BFE8B0; }
  .result.no { background:#FEF4F4; border:1px solid #F3C2C3; }
  .result .rt { font-size:15px; font-weight:700; margin-bottom:6px; }
  .result.ok .rt { color:#2E7D32; }
  .result.no .rt { color:#B33235; }
  .result .ans { font-weight:600; }
  .result .ana { margin-top:8px; color:#374151; }
  .result .ana .al { font-weight:600; color:#0E8F8B; }

  .nav { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .nav .btn { flex:1; min-width:100px; padding:11px 12px; font-size:14px; border-radius:10px; }
  .nav .btn:disabled { opacity:.4; cursor:not-allowed; }

  .cardgrid { margin-top:14px; background:#fff; border-radius:14px; padding:16px; display:none; box-shadow:0 1px 6px rgba(0,0,0,.06); }
  .cardgrid.show { display:block; }
  .cardgrid .cg-title { font-size:13px; font-weight:700; margin-bottom:12px; color:#374151; }
  .cg { display:grid; grid-template-columns:repeat(auto-fill,minmax(36px,1fr)); gap:8px; }
  .cg .cell { height:40px; border-radius:9px; border:1.5px solid #E4E3DD; background:#fff; font-size:12.5px; font-weight:600; color:#4B5563; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cg .cell.done { background:#EAF6EA; border-color:#BFE8B0; color:#2E7D32; }
  .cg .cell.wrong { background:#FBE9E9; border-color:#F3C2C3; color:#B33235; }
  .cg .cell.right { background:#F0FAF9; border-color:#0E8F8B; color:#0E8F8B; }
  .cg .cell.cur { outline:2px solid #0E8F8B; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:11.5px; color:#6B7280; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:4px; margin-right:4px; vertical-align:-2px; }

  .prog { margin-top:14px; background:#fff; border-radius:12px; padding:12px 14px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .prog .pt { font-size:12.5px; color:#6B7280; margin-bottom:8px; }
  .progbar { height:8px; background:#EDEBE4; border-radius:99px; overflow:hidden; }
  .progbar i { display:block; height:100%; background:linear-gradient(90deg,#0E8F8B,#3FBF9A); border-radius:99px; transition:width .3s; width:0; }

  .tip { margin-top:14px; background:#FFF9E8; border:1px solid #F0E0A8; color:#7A5F0E; border-radius:11px; padding:11px 14px; font-size:12.5px; line-height:1.7; display:none; }
  .tip.show { display:block; }

  .footer { text-align:center; font-size:11.5px; color:#9CA3AF; margin-top:22px; line-height:1.8; }

  @media (max-width:480px){
    body { padding:12px 8px 50px; }
    .qstem { font-size:15px; }
    .opt .val { font-size:14px; }
    .header { padding:16px; }
    .header h1 { font-size:18px; }
    .qcard { padding:16px; }
    .btn { padding:9px 12px; min-height:40px; }
    .actrow .btn { padding:11px 12px; }
    .opt { padding:12px 12px; }
    .stat { min-width:72px; padding:8px 10px; }
  }
</style>
</head>

2026.3.17新增）", "options": [{"order": "A", "content": "调试器"}, {"order": "B", "content": "日志查看器"}, {"order": "C", "content": "性能分析器"}, {"order": "D", "content": "模拟器"}], "answer": "ABCD", "answerText": "ABCD"}, {"no": 44, "qstId": 412646, "type": 2, "typeName": "多选题", "stem": "ArkUIInspector可以显示以下哪些组件的属性信息?", "analysis": "", "point": "", "paperId": 947134, "paperName": "鸿蒙HCIP 02（2026.3.17新增）", "options": [{"order": "A", "content": "margin"}, {"order": "B", "content": "border"}, {"order": "C", "content": "Width和Height"}, {"order": "D", "content": "padding"}], "answer": "ABCD", "answerText": "ABCD"}, {"no": 45, "qstId": 412641, "type": 2, "typeName": "多选题", "stem": "三分栏效果的实现，需要结合以下哪些组件?（3.31校对）", "analysis": "<p style=\"padding: 0px; margin: 0px 0px 8px; box-sizing: border-box; font-family: HarmonyOS_Sans_SC, HarmonyOSHans-fallback, &quot;Microsoft Yahei&quot;, sans-serif; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; font-size: 14px; white-space: normal;\">在HarmonyOS中，三分栏效果的实现方案是组合使用 <span style=\"padding: 0px; margin: 0px; box-sizing: border-box; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; font-weight: 600;\">SideBarContainer</span> 组件与 <span style=\"padding: 0px; margin: 0px; box-sizing: border-box; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; font-weight: 600;\">Navigation</span> 组件，并结合断点响应式布局能力<span class=\"quoteV2\" data-index=\"H.1.4\" style=\"padding: 0.02rem 0.06rem; margin: 0.02rem; box-sizing: border-box; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; vertical-align: baseline; position: relative; bottom: 0.5em; display: inline; color: rgb(10, 89, 247); font-size: 0.12rem; zoom: 0.66; font-weight: 700; line-height: 0.11rem; border-radius: 0.04rem; background: rgba(10, 89, 247, 0.1); cursor: pointer;\">1</span>。</p><p style=\"padding: 0px; margin: 0px 0px 8px; box-sizing: border-box; font-family: HarmonyOS_Sans_SC, HarmonyOSHans-fallback, &quot;Microsoft Yahei&quot;, sans-serif; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; font-size: 14px; white-space: normal;\">具体实现原理如下：</p><ul style=\"padding: 0px 0px 0px 0.22rem; margin: 0px 0px 16px; box-sizing: border-box; font-family: HarmonyOS_Sans_SC, HarmonyOSHans-fallback, &quot;Microsoft Yahei&quot;, sans-serif; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; margin-block: 0px; margin-inline: 0px; padding-inline: 0.15rem 0px; font-size: 14px; white-space: normal;\"><li style=\"padding: 0px; margin: 0px 0px 8px; box-sizing: border-box; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; list-style: inherit;\"><strong style=\"padding: 0px; margin: 0px; box-sizing: border-box; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s;\">SideBarContainer</strong>：提供侧边栏容器，通过两个子组件分别定义侧边栏区域和内容区。在三分栏场景中，侧边栏作为第一栏（如账户信息/一级目录），内容区中嵌入 Navigation 组件<span class=\"quoteV2\" data-index=\"H.1.2\" style=\"padding: 0.02rem 0.06rem; margin: 0.02rem; box-sizing: border-box; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; vertical-align: baseline; position: relative; bottom: 0.5em; display: inline; color: rgb(10, 89, 247); font-size: 0.12rem; zoom: 0.66; font-weight: 700; line-height: 0.11rem; border-radius: 0.04rem; background: rgba(10, 89, 247, 0.1); cursor: pointer;\">2</span>。</li><li style=\"padding: 0px; margin: 0px 0px 8px; box-sizing: border-box; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; list-style: inherit;\"><strong style=\"padding: 0px; margin: 0px; box-sizing: border-box; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s;\">Navigation</strong>：作为路由容器组件，支持单栏（Stack）、分栏（Split）和自适应（Auto）三种显示模式。嵌入 SideBarContainer 的内容区后，Navigation 自身的分栏能力将内容区再分为两栏（如二级目录列表 + 详情内容），从而形成三分栏效果<span class=\"quoteV2\" data-index=\"W.1.3\" style=\"padding: 0.02rem 0.06rem; margin: 0.02rem; box-sizing: border-box; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; vertical-align: baseline; position: relative; bottom: 0.5em; display: inline; color: rgb(10, 89, 247); font-size: 0.12rem; zoom: 0.66; font-weight: 700; line-height: 0.11rem; border- e: normal;font-kerning: auto;font-optical-sizing: auto;font-feature-settings: normal;font-variation-settings: normal;font-stretch: normal;font-size: 9px;line-height: normal;font-family: &#39;Times New Roman&#39;\">&nbsp;</span></span><span style=\";font-family:宋体;font-size:16px\"><span style=\"font-family:宋体\">• enable</span><span style=\"font-family:ＭＳ 明朝\">（启用状态）：用于控制组件是否可以响应点击、触摸等事件，但</span><span style=\"font-family:宋体\">enabled</span><span style=\"font-family:ＭＳ 明朝\">属性的变化不会引起</span><span style=\"font-family:宋体\">UI</span><span style=\"font-family:ＭＳ 明朝\">的视觉变化，因此不适合作为可动画属性。</span></span></p><p><span style=\"font-family:Symbol;font-size:16px\">·<span style=\"font-style: normal;font-variant: normal;font-size-adjust: none;font-language-override: normal;font-kerning: auto;font-optical-sizing: auto;font-feature-settings: normal;font-variation-settings: normal;font-stretch: normal;font-size: 9px;line-height: normal;font-family: &#39;Times New Roman&#39;\">&nbsp;</span></span><span style=\";font-family:宋体;font-size:16px\"><span style=\"font-family:宋体\">• backgroundColor</span><span style=\"font-family:ＭＳ 明朝\">（背景颜色）：属于背景类属性，变化会改变组件的视觉外观，且颜色渐变效果自然，支持动画。</span></span></p><p><span style=\"font-family:Symbol;font-size:16px\">·<span style=\"font-style: normal;font-variant: normal;font-size-adjust: none;font-language-override: normal;font-kerning: auto;font-optical-sizing: auto;font-feature-settings: normal;font-variation-settings: normal;font-stretch: normal;font-size: 9px;line-height: normal;font-family: &#39;Times New Roman&#39;\">&nbsp;</span></span><span style=\";font-family:宋体;font-size:16px\"><span style=\"font-family:宋体\">• focusable</span><span style=\"font-family:ＭＳ 明朝\">（可聚焦）：决定当前组件是否可以获得焦点，当</span><span style=\"font-family:宋体\">focusable</span><span style=\"font-family:ＭＳ 明朝\">属性发生变化时，应立即切换到终点值以响应用户行为，不应该加入动画效果。</span></span></p>", "point": "", "paperId": 949605, "paperName": "鸿蒙HCIP 03（2026.8.20新增）", "options": [{"order": "A", "content": "width"}, {"order": "B"  "B", "answerText": "B"}, {"no": 36, "qstId": 413599, "type": 3, "typeName": "判断题", "stem": "一款HarmonyOS直播软件可以使用Media Kit来实现直播视频的实时播放。", "analysis": "", "point": "", "paperId": 949605, "paperName": "鸿蒙HCIP 03（2026.8.20新增）", "options": [{"order": "A", "content": "正确"}, {"order": "B", "content": "错误"}], "answer": "A", "answerText": "A"}, {"no": 37, "qstId": 413790, "type": 3, "typeName": "判断题", "stem": "键值型数据库是一种关系型数据库，其数据以“键值”对的形式进行组织、索引和存储。", "analysis": "", "point": "", "paperId": 949605, "paperName": "鸿蒙HCIP 03（2026.8.20新增）", "options": [{"order": "A", "content": "正确"}, {"order": "B", "content": "错误"}], "answer": "B", "answerText": "B"}, {"no": 38, "qstId": 413796, "type": 3, "typeName": "判断题", "stem": "编译静态共享包时，不会将模块中的C++代码直接打包进.har文件中，而是将C++代码编译成动态依赖库.so文件放置在.har文件中的根目录下。", "analysis": "<p style=\"padding: 0px; margin: 0px 0px 8px; box-sizing: border-box; font-family: HarmonyOS_Sans_SC, HarmonyOSHans-fallback, &quot;Microsoft Yahei&quot;, sans-serif; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; font-size: 14px; white-space: normal;\">题干中关于&quot;C++代码不会被直接打包进 .har 文件，而是编译成 .so 动态链接库&quot;的描述是正确的，但关键错误在于 .so 文件的存放位置。</p><p style=\"padding: 0px; margin: 0px 0px 8px; box-sizing: border-box; font-family: HarmonyOS_Sans_SC, HarmonyOSHans-fallback, &quot;Microsoft Yahei&quot;, sans-serif; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geometricprecision; transition: background 0.15s, background-color 0.15s, color 0.15s, opacity 0.15s; font-size: 14px; white-space: normal;\">在编译静态共享包（HAR）时，模块中的 C++ 代码会被编译为 .so 动态链接库文件，但这些 .so 文件应放置在 .har 文件中的 <span style=\"padding: 0px; margin: 0px; box-sizing: border-box; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: geo -variant: normal; font-stretch: 100%; line-height: 22px; font-optical-sizing: auto; font-size-adjust: none; font-kerning: auto; font-feature-settings: normal; font-variation-settings: normal; font-language-override: normal; font-family: Menlo, Monaco, Consolas, &quot;Cascadia Mono&quot;, &quot;Ubuntu Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, &quot;JetBrains Mono&quot;, &quot;Fira Code&quot;, Cousine, &quot;Roboto Mono&quot;, &quot;Courier New&quot;, Courier, sans-serif, system-ui; background-color: rgb(235, 238, 242); border-radius: 6px; align-items: center; padding: 0px 5px; display: inline-flex; font-size: 0.875em !important;\">flexGrow</code><span class=\"\"> 两个属性的作用。</span></p><p class=\"ds-markdown-paragraph\" style=\"margin: 16px 0px; color: rgb(15, 17, 21); font-family: quote-cjk-patch, Inter, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Oxygen, Ubuntu, Cantarell, &quot;Open Sans&quot;, &quot;Helvetica Neue&quot;, sans-serif; white-space: normal; background-color: rgb(255, 255, 255);\"><span class=\"\">当父容器宽度</span><span style=\"font-weight: 600;\">大于</span><span class=\"\">所有子组件宽度的总和时，说明有多余的正向空间需要分配。这时控制子组件如何“拉伸”以填满多余空间的属性是 </span><span style=\"font-weight: 600;\"><code style=\"box-sizing: border-box; font-variant: normal; font-weight: 400; font-stretch: 100%; line-height: 22px; font-optical-sizing: auto; font-size-adjust: none; font-kerning: auto; font-feature-settings: normal; font-variation-settings: normal; font-language-override: normal; font-family: Menlo, Monaco, Consolas, &quot;Cascadia Mono&quot;, &quot;Ubuntu Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, &quot;JetBrains Mono&quot;, &quot;Fira Code&quot;, Cousine, &quot;Roboto Mono&quot;, &quot;Courier New&quot;, Courier, sans-serif, system-ui; background-color: rgb(235, 238, 242); border-radius: 6px; align-items: center; padding: 0px 5px; display: inline-flex; font-size: 0.875em !important;\">flexGrow</code></span> const TYPE_NAMES = {1:'单选题',2:'多选题',3:'判断题',7:'填空题'};
const $ = id => document.getElementById(id);

// ---------- 状态 ----------
let state = {
  paper: 'all',      // all | paperId
  type: 'all',       // all | 1|2|3|7
  shuffle: false,
  wrongOnly: false,
  order: [],         // 当前范围题目顺序
  idx: 0,
  sel: {},           // 当前题作答 {qstId: [选项] 或 {blanks:[...]}}
  records: {},       // qstId -> {answer, correct}
};
const LS_KEY = 'xhmo_exam_records_v1';

// ---------- 数据准备 ----------
const ALL = [];
DATA.papers.forEach(p => p.questions.forEach(q => { q._paperName = p.name; ALL.push(q); }));

function typeOf(scope) { return scope.type === 'all' ? 0 : Number(scope.type); }
function paperIdOf(scope) { return scope.paper === 'all' ? 0 : Number(scope.paper); }
function inScope(q, scope) {
  if (scope.paper !== 'all' && q.paperId !== paperIdOf(scope)) return false;
  if (scope.type !== 'all' && q.type !== typeOf(scope)) return false;
  return true;
}
function buildOrder() {
  const scope = { paper: state.paper, type: state.type };
  let list = ALL.filter(q => inScope(q, scope));
  if (state.wrongOnly) list = list.filter(q => state.records[q.qstId] && state.records[q.qstId].correct === false);
  if (state.shuffle) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
  }
  return list;
}

// ---------- 本地存储 ----------
function loadRec() {
  try { state.records = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { state.records = {}; }
}
function saveRec() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state.records)); } catch (e) {}
}

// ---------- 渲染 ----------
function qSel() {
  const q = state.order[state.idx];
  const rec = state.records[q.qstId];
  return { q, rec };
}

function renderStats() {
  const total = state.order.length;
  let done = 0, right = 0, wrong = 0;
  state.order.forEach(q => {
    const r = state.records[q.qstId];
    if (!r) return;
    done++;
    if (r.correct) right++; else wrong++;
  });
  $('stTotal').textContent = total;
  $('stDone').textContent = done;
  $('stRight').textContent = right;
  $('stWrong').textContent = wrong;
  $('stRate').textContent = done ? Math.round(right / done * 100) + '%' : '--';
  $('progText').textContent = '进度 ' + done + '/' + total;
  $('progBar').style.width = total ? (done / total * 100) + '%' : '0';
  $('wrongTipN').textContent = wrong;
  $('wrongTip').classList.toggle('show', state.wrongOnly);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function stemHtml(q) {
  // 题干已是受控 HTML（仅图片/基础标签），直接渲染
  let h = q.stem;
  if (q.point) {
    h += '<p style="color:#9CA3AF;font-size:12.5px;margin-top:8px">考点：' + esc(q.point) + '</p>';
  }
  return h;
}
function renderQuestion() {
  const { q, rec } = qSel();
  $('qNo').textContent = '第 ' + (state.idx + 1) + ' / ' + state.order.length + ' 题';
  const tag = $('qTag');
  tag.textContent = q.typeName;
  tag.className = 'tag t' + q.type;
  $('qStem').innerHTML = stemHtml(q);

  const isFill = q.type === 7;
  $('qFill').style.display = isFill ? 'block' : 'none';
  const optsWrap = $('qOpts');
  optsWrap.innerHTML = '';
  if (!isFill) {
    q.options.forEach(o => {
      const div = document.createElement('div');
      div.className = 'opt';
      div.dataset.order = o.order;
      div.innerHTML = '<span class="key">' + esc(o.order) + '</span><span class="val">' + o.content + '</span>';
      div.onclick = () => pickOption(q, o.order, div);
      optsWrap.appendChild(div);
    });
  }
  // 回显
  state.sel = {};
  if (rec) {
    const ans = rec.answer;
    if (isFill) {
      $('fillInput').value = Array.isArray(ans) ? ans[0] || '' : ans || '';
    } else if (typeof ans === 'string') {
      const letters = ans.split('');
      state.sel[q.qstId] = letters;
    }
  } else {
    if (isFill) $('fillInput').value = '';
    else if (q.type === 7) {}
  }
  syncOptsUI(q);
  renderResult(q, rec);
  renderCard();
  $('btnPrev').disabled = state.idx === 0;
  $('btnNext').disabled = state.idx >= state.order.length - 1;
}

function pickOption(q, order, el) {
  const rec = state.records[q.qstId];
  if (rec) return; // 已判分不可改
  const key = q.qstId;
  const cur = state.sel[key] || [];
  if (q.type === 2) {
    const i = cur.indexOf(order);
    if (i >= 0) cur.splice(i, 1); else cur.push(order);
    cur.sort();
    state.sel[key] = cur;
  } else {
    state.sel[key] = [order];
  }
  syncOptsUI(q);
}

function syncOptsUI(q) {
  const cur = state.sel[q.qstId] || [];
  const rec = state.records[q.qstId];
  document.querySelectorAll('#qOpts .opt').forEach(el => {
    const o = el.dataset.order;

    if (rec) {
      el.classList.add('disabled');
      const ans = String(rec.answer);
      if (ans.includes(o)) el.classList.add('right');
      else if (cur.includes(o)) el.classList.add('wrong');
    }
  });
  $('btnClearAns').style.visibility = rec ? 'hidden' : 'visible';
}

function judgeAnswer(q) {
  let userAns;
  if (q.type === 7) {
    const v = ($('fillInput').value || '').trim();
    userAns = [v];
  } else {
    const cur = (state.sel[q.qstId] || []).slice();
    userAns = q.type === 2 ? cur.sort().join('') : (cur[0] || '');
  }
  const correct = isCorrect(q, userAns);
  state.records[q.qstId] = { answer: userAns, correct };
  saveRec();
  renderQuestion();
  renderStats();
  if (correct) {
    toast('回答正确 ✓');
  } else {
    toast('回答错误，已加入错题本');
  }
}

function isCorrect(q, userAns) {
  if (q.type === 7) {
    const want = q.answer.map(a => String(a).trim().toLowerCase());
    const got = (userAns || []).map(a => String(a).trim().toLowerCase());
    if (want.length !== got.length) return false;
    return want.every((w, i) => w === got[i]);
  }
  const want = String(q.answer).toUpperCase();
  const got = String(userAns || '').toUpperCase();
  if (q.type === 2) {
    return want.split('').sort().join('') === got.split('').sort().join('');
  }
  return want === got;
}

function renderResult(q, rec) {
  const box = $('qResult');
  if (!rec) { box.className = 'result'; box.innerHTML = ''; return; }
  let html = '';
  if (rec.correct) {
    html += '<div class="rt">✓ 回答正确</div>';
  } else {
    html += '<div class="rt">✗ 回答错误</div>';
  }
  const ansText = q.type === 7 ? esc(q.answerText) : esc(String(q.answer));
  html += '<div class="ans">正确答案：' + ansText + '</div>';
  if (q.type !== 7 && Array.isArray(rec.answer) && rec.answer.length) {
    html += '<div>你的答案：' + esc(rec.answer.join('')) + '</div>';
  } else if (q.type === 7) {
    html += '<div>你的答案：' + esc((rec.answer && rec.answer[0]) || '（未作答）') + '</div>';
  }
  if (q.analysis) {
    html += '<div class="ana"><span class="al">解析：</span>' + q.analysis + '</div>';
  } else {
    html += '<div class="ana"><span class="al">解析：</span>本题暂无解析</div>';
  }
  box.className = 'result show ' + (rec.correct ? 'ok' : 'no');
  box.innerHTML = html;
}

function renderCard() {
  const cg = $('cgCells');
  cg.innerHTML = '';
  state.order.forEach((q, i) => {
    const rec = state.records[q.qstId];
    const cell = document.createElement('div');
    cell.className = 'cell';
    if (i === state.idx) cell.classList.add('cur');
    if (rec) {
      cell.classList.add(rec.correct ? 'right' : 'wrong');
    }
    cell.textContent = i + 1;
    cell.onclick = () => { state.idx = i; $('cardGrid').classList.remove('show'); renderQuestion(); };
    cg.appendChild(cell);
  });
}

// ---------- 控件 ----------
function initControls() {
  const sp = $('selPaper');
  sp.innerHTML = '<option value="all">全部试卷（252题）</option>';
  DATA.papers.forEach(p => {
    sp.innerHTML += '<option value="' + p.paperId + '">' + esc(p.name) + '（' + p.questions.length + '题）</option>';
  });
  const st = $('selType');
  st.innerHTML = '<option value="all">全部题型</option>';
  [1,2,3,7].forEach(t => {
    const n = ALL.filter(q => q.type === t).length;
    st.innerHTML += '<option value="' + t + '">' + TYPE_NAMES[t] + '（' + n + '）</option>';
  });
  sp.onchange = () => { state.paper = sp.value; state.idx = 0; rebuild(); };
  st.onchange = () => { state.type = st.value; state.idx = 0; rebuild(); };
  $('btnShuffle').onclick = () => { state.shuffle = !state.shuffle; $('btnShuffle').classList.toggle('on', state.shuffle); state.idx = 0; rebuild(); };
  $('btnWrongOnly').onclick = () => { state.wrongOnly = !state.wrongOnly; $('btnWrongOnly').classList.toggle('on', state.wrongOnly); state.idx = 0; rebuild(); };
  $('btnReset').onclick = () => {
    if (confirm('确定清空全部作答记录？')) {
      state.records = {}; saveRec(); rebuild();
    }
  };
  $('btnSubmit').onclick = () => {
    const { q, rec } = qSel();
    if (rec) return;
    if (q.type === 7) {
      if (!($('fillInput').value || '').trim()) { toast('请先输入答案'); return; }
    } else {
      if (!(state.sel[q.qstId] || []).length) { toast('请先选择答案'); return; }
    }
    judgeAnswer(q);
  };
  $('btnClearAns').onclick = () => {
    delete state.sel[qSel().q.qstId];
    if (qSel().q.type === 7) $('fillInput').value = '';
    renderQuestion();
  };
  $('btnPrev').onclick = () => { if (state.idx > 0) { state.idx--; renderQuestion(); } };
  $('btnNext').onclick = () => { if (state.idx < state.order.length - 1) { state.idx++; renderQuestion(); } };
  $('btnCard').onclick = () => $('cardGrid').classList.toggle('show');
  $('fillInput').onkeydown = e => { if (e.key === 'Enter') $('btnSubmit').click(); };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft') $('btnPrev').click();
    if (e.key === 'ArrowRight') $('btnNext').click();
  });
}

function rebuild() {
  state.order = buildOrder();
  if (state.order.length === 0) {
    $('stTotal').textContent = 0;
    $('qStem').innerHTML = '<p style="color:#9CA3AF">当前筛选下没有题目。</p>';
    $('qOpts').innerHTML = '';
    $('qFill').style.display = 'none';
    $('qResult').className = 'result';
    $('qResult').innerHTML = '';
    renderStats();
    return;
  }
  if (state.idx >= state.order.length) state.idx = state.order.length - 1;
  renderQuestion();
  renderStats();
}

let toastTimer = null;
function toast(msg) {
  let el = $('toastEl');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toastEl';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(26,27,28,.9);color:#fff;padding:10px 20px;border-radius:99px;font-size:13.5px;z-index:99;transition:opacity .3s;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1500);
}

// ---------- 启动 ----------
$('hdTotal').textContent = ALL.length;
loadRec();
initControls();
rebuild();
</script>
</body>
</html>
